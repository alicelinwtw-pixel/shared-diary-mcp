name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Import Hugging Face entrypoint
        run: |
          pip install -r requirements.txt
          DIARY_ADMIN_KEY=ci-test-admin-key-0123456789abcdef python -c "import app; print('HF entrypoint import OK')"
